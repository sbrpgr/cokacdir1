[package]
name = "cokacdir"
version = "0.6.12"
edition = "2021"
authors = ["cokac <monogatree@gmail.com>"]
description = "Telegram/Discord bot that runs Claude Code, Codex, Gemini, and Opencode, with a multi-panel terminal file manager"
license = "MIT"
repository = "https://github.com/kstost/cokacdir"
homepage = "https://cokacdir.cokac.com"
keywords = ["terminal", "cli", "file-manager", "multi-panel", "tui", "ai"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_28", "layout-cache", "underline-color", "unstable-rendered-line-info"] }
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "5"
unicode-width = "0.2"
textwrap = "0.16"
image = "0.25"
regex = "1"
rand = "0.8"
supports-color = "3"
base64 = "0.22"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cipher = { version = "0.4", features = ["block-padding"] }
pbkdf2 = "0.12"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
md-5 = "0.10"
thiserror = "1"
russh = { version = "0.62.7", default-features = false, features = ["flate2", "aws-lc-rs"] }
russh-sftp = "2.0"
async-trait = "0.1"
ratatui-image = { version = "11.1.0", default-features = false, features = ["image-defaults", "crossterm"] }
teloxide = { version = "0.17", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "http", "model", "builder", "cache", "native_tls_backend"] }
slack-morphism = { version = "2", features = ["hyper"] }
fs2 = "0.4"
filetime = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "cokacdir"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
